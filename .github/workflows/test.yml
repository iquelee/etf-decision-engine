name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps (numpy/pandas)
        run: pip install numpy pandas

      # 6 道门禁：
      #   Gate 1  Node 单元测试（Stage A）
      #   Gate 2  Python 单元测试（Stage B）
      #   Gate 3  Immutable 冻结检查（Stage C）
      #   Gate 4  Cross-language Parity（Stage D）
      #   Gate 5  Secret scan（Stage E）
      #   Gate 6  GEN2_RULE_V2_BUNDLE 冻结（见下）
      - name: Run full test gates (npm test)
        env:
          TCB_PYTHON: python
        run: node scripts/test-all.js

      - name: Gate 6 — GEN2_RULE_V2_BUNDLE frozen
        run: |
          if ! git diff --quiet HEAD -- ml/gen2/manifests/GEN2_RULE_V2_BUNDLE.json; then
            echo "::error::GEN2_RULE_V2_BUNDLE.json 被改动（rule-v2 单一真相源，禁止随提交漂移）"
            exit 1
          fi
          echo "GEN2_RULE_V2_BUNDLE.json frozen (sha256=$(sha256sum ml/gen2/manifests/GEN2_RULE_V2_BUNDLE.json | cut -d' ' -f1))"
