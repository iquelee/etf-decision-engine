name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # P0-C：Node 16 对齐 CloudBase 生产 runtime（Nodejs16.13），Node 22 面向未来兼容
        node-version: ['16', '22']
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps (numpy/pandas)
        run: pip install numpy pandas

      # 门禁（P0-B：npm test 现已含 Stage F = build-cloudfunctions.js 的 Build Common Parity）：
      #   Stage A  Node 单元测试
      #   Stage B  Python 单元测试
      #   Stage C  Immutable 真 SHA 锁（Gen-1 frozen / V3.6.1 / GEN2 bundle，P0-A 替代 git-diff 假锁）
      #   Stage D  Cross-language Parity
      #   Stage E  Secret scan
      #   Stage F  Build Common Parity（src/common → 11 云函数 + SHA 校验）
      - name: Run full test gates (npm test)
        env:
          TCB_PYTHON: python
        run: node scripts/test-all.js

      # Gate 6（显式，与 Stage C 同源）：Immutable 真 SHA 锁，任一 frozen 对象被改 → FAIL
      - name: Gate 6 — Immutable SHA (Gen-1 / V3.6.1 / GEN2 bundle)
        run: node scripts/verify-immutable.js
